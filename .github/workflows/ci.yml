name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same pinned hooks as a local `pre-commit install` (see .pre-commit-config.yaml).
      - name: shellcheck, prettier, hygiene
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: bats
        run: pipx run pre-commit run --all-files --hook-stage pre-push

  # Each supported release in a throwaway container: catches release differences (apt,
  # dpkg, bash) that unit tests with mocks cannot. --apply is safe here, and only here:
  # it changes the container, which is discarded, never the runner.
  container:
    name: container (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            "ubuntu:20.04",
            "ubuntu:22.04",
            "ubuntu:24.04",
            "ubuntu:26.04",
            "debian:12",
            "debian:13",
          ]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash # bash -eo pipefail: a failing run is not hidden by tee
    steps:
      - uses: actions/checkout@v5
      - name: dry run
        run: |
          apt-get update -qq
          ./bin/ubuntu-maintain | tee manifest.out
          # apt >= 1.9.11 on every release here, so the native lock wait must be detected.
          grep -q 'lock_wait: dpkg_timeout' manifest.out
      - name: apply (monthly)
        run: |
          ./bin/ubuntu-maintain --apply --mode monthly --ignore-stability | tee apply.out
          grep -q '^=== Result ===' apply.out
      - name: nothing left to remove
        run: |
          ./bin/ubuntu-maintain --mode monthly | tee after.out
          grep -q 'autoremove (before upgrades): 0 package(s)' after.out
