name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same pinned hooks as a local `pre-commit install` (see .pre-commit-config.yaml).
      - name: shellcheck, prettier, hygiene
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: bats
        run: pipx run pre-commit run --all-files --hook-stage pre-push

  # Dry run on each supported LTS: catches release differences (apt, dpkg, bash) that
  # unit tests with mocks cannot. No --apply: it would change the runner.
  manifest:
    name: manifest (${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
    container: ubuntu:${{ matrix.ubuntu }}
    defaults:
      run:
        shell: bash # bash -eo pipefail: a failing run is not hidden by tee
    steps:
      - uses: actions/checkout@v5
      - name: dry run
        run: |
          apt-get update -qq
          ./bin/ubuntu-maintain | tee manifest.out
          # apt >= 1.9.11 on every release here, so the native lock wait must be detected.
          grep -q 'lock_wait: dpkg_timeout' manifest.out
